<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITISENSE Pro | AI Agronomist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #a29bfe;
            --secondary: #55efc4;
            --bg: #0d0d0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #ff7675;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #f1f2f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-weight: 700;
            font-size: 34px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .upload-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--secondary);
            opacity: 0.8;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            cursor: pointer;
        }

        button {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-pdf {
            background: var(--primary);
            color: white;
            margin-top: 20px;
            display: none;
        }

        .report-section {
            margin-top: 40px;
            padding: 30px;
            background: #fff;
            color: #1a1a1a;
            border-radius: 24px;
            display: none;
        }

        .report-header {
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .markdown-body h2 {
            color: #2d3436;
            font-size: 18px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .loading {
            animation: pulse 1.5s infinite;
            opacity: 0.6;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.6;
            }
        }

        /* Camera styles */
        .cam-btn {
            width: auto;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            margin: 0;
            font-size: 12px;
            font-weight: bold;
        }

        .preview-img {
            max-height: 200px;
            width: 100%;
            object-fit: cover;
            margin-top: 15px;
            border-radius: 12px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .camera-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .camera-modal video {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .camera-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
        }

        .camera-controls button {
            margin: 0;
            flex: 1;
            border-radius: 12px;
            font-size: 14px;
        }

        .btn-close {
            background: #ff7675;
            color: white;
        }

        .btn-capture {
            background: var(--secondary);
            color: #000;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <h1>VITISENSE <span style="font-weight: 300;">V3</span></h1>
        <div class="subtitle">Next-Gen Agricultural Intelligence</div>

        <form id="mainForm" enctype="multipart/form-data">
            <div class="upload-card">
                <div class="header-row">
                    <label style="margin:0;">🍃 Leaf Pathology Scan</label>
                    <button type="button" class="cam-btn" onclick="openCamera('leaf')">📷 CAPTURE</button>
                </div>
                <input type="file" id="leafInput" name="leaf_image" accept="image/*" required>
                <img id="leafPreview" class="preview-img">
            </div>
            <div class="upload-card">
                <div class="header-row">
                    <label style="margin:0;">🍇 Visual Ripeness Scan</label>
                    <button type="button" class="cam-btn" onclick="openCamera('grape')">📷 CAPTURE</button>
                </div>
                <input type="file" id="grapeInput" name="grape_image" accept="image/*" required>
                <img id="grapePreview" class="preview-img">
            </div>
            <div class="upload-card">
                <div class="header-row">
                    <label style="margin:0;">💧 Moisture Level (%)</label>
                    <span id="calculatedBrixDisplay"
                        style="color: var(--secondary); font-size: 12px; font-weight: bold; background: rgba(85, 239, 196, 0.1); padding: 4px 8px; border-radius: 6px;">Brix:
                        18.0%</span>
                </div>
                <input type="number" step="0.1" id="moistureInput" placeholder="Enter moisture (e.g. 82)" value="95.0">
                <input type="hidden" name="sugar" id="hiddenSugarInput" value="21.0">
            </div>
            <button type="submit" id="analyzeBtn">GENERATE ADVISORY REPORT</button>
        </form>

        <div id="rawReport" style="display:none;">{{ report if result else "" }}</div>

        <div class="report-section" id="reportSection">
            <div class="report-header">
                <h3>OFFICIAL DIAGNOSTIC REPORT</h3><span id="reportIdDisplay">ID: #0000</span>
            </div>
            <div class="markdown-body" id="reportContent"></div>

            <form id="pdfForm" action="/download-report" method="POST">
                <input type="hidden" name="report_content" id="pdfContent">
                <button type="submit" class="btn-pdf" id="pdfBtn">📥 DOWNLOAD DETAILED PDF</button>
            </form>
        </div>
    </div>

    <div class="camera-modal" id="cameraModal">
        <video id="videoElement" autoplay playsinline></video>
        <div class="camera-controls">
            <button type="button" class="btn-close" onclick="closeCamera()">CANCEL</button>
            <button type="button" class="btn-capture" onclick="takeSnapshot()">📸 SNAP PHOTO</button>
        </div>
    </div>

    <script>
        const RENDER_URL = "/";
        const mainForm = document.getElementById('mainForm');
        const btn = document.getElementById('analyzeBtn');
        const reportSection = document.getElementById('reportSection');
        const reportContent = document.getElementById('reportContent');

        let leafBlob = null;
        let grapeBlob = null;
        let stream = null;
        let currentCaptureType = null;
        const videoElement = document.getElementById('videoElement');
        const cameraModal = document.getElementById('cameraModal');

        window.onload = function () {
            const rawData = document.getElementById('rawReport').textContent;
            if (rawData.trim().length > 0) { displayReport(rawData); }
        };

        // Camera functionality
        async function openCamera(type) {
            currentCaptureType = type;
            cameraModal.style.display = 'flex';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or unavailable. Please check permissions.");
                closeCamera();
            }
        }

        function closeCamera() {
            cameraModal.style.display = 'none';
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function takeSnapshot() {
            if (!stream) return;
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                if (currentCaptureType === 'leaf') {
                    leafBlob = blob;
                    document.getElementById('leafPreview').src = url;
                    document.getElementById('leafPreview').style.display = 'block';
                    document.getElementById('leafInput').removeAttribute('required');
                } else if (currentCaptureType === 'grape') {
                    grapeBlob = blob;
                    document.getElementById('grapePreview').src = url;
                    document.getElementById('grapePreview').style.display = 'block';
                    document.getElementById('grapeInput').removeAttribute('required');
                }
                closeCamera();
            }, 'image/jpeg');
        }

        // Handle manual file selection to show preview and clear captured blob
        document.getElementById('leafInput').addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                leafBlob = null;
                const url = URL.createObjectURL(e.target.files[0]);
                document.getElementById('leafPreview').src = url;
                document.getElementById('leafPreview').style.display = 'block';
            }
        });

        document.getElementById('grapeInput').addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                grapeBlob = null;
                const url = URL.createObjectURL(e.target.files[0]);
                document.getElementById('grapePreview').src = url;
                document.getElementById('grapePreview').style.display = 'block';
            }
        });

        // Moisture to Brix calculation
        const moistureInput = document.getElementById('moistureInput');
        const calculatedBrixDisplay = document.getElementById('calculatedBrixDisplay');
        const hiddenSugarInput = document.getElementById('hiddenSugarInput');

        moistureInput.addEventListener('input', function (e) {
            const moisture = parseFloat(e.target.value);
            if (!isNaN(moisture)) {
                // Direct correlation: more moisture = more Brix
                const brix = (moisture * 0.25).toFixed(1);
                calculatedBrixDisplay.innerText = `Brix: ${brix}%`;
                hiddenSugarInput.value = brix;
            } else {
                calculatedBrixDisplay.innerText = `Brix: --%`;
                hiddenSugarInput.value = '21.0';
            }
        });

        mainForm.onsubmit = async function (e) {
            e.preventDefault();
            btn.innerHTML = "NEURAL PROCESSING...";
            btn.classList.add('loading');

            const formData = new FormData(mainForm);
            // Append captured blobs if they exist, overriding the file inputs
            if (leafBlob) formData.set('leaf_image', leafBlob, 'leaf_capture.jpg');
            if (grapeBlob) formData.set('grape_image', grapeBlob, 'grape_capture.jpg');

            try {
                const response = await fetch(RENDER_URL, { method: 'POST', body: formData });
                const htmlResponse = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlResponse, 'text/html');
                const newReport = doc.getElementById('rawReport').textContent;
                if (newReport) { displayReport(newReport); }
            } catch (error) { alert("AI Connection Failed. Ensure Render is awake."); }
            finally { btn.innerHTML = "GENERATE ADVISORY REPORT"; btn.classList.remove('loading'); }
        };

        function displayReport(content) {
            reportContent.innerHTML = marked.parse(content);
            document.getElementById('pdfContent').value = content;
            document.getElementById('reportIdDisplay').innerText = "ID: #" + Math.floor(1000 + Math.random() * 9000);
            reportSection.style.display = 'block';
            document.getElementById('pdfBtn').style.display = 'block';
            reportSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>

</html>
